<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trivia Murder Party</title>
  <meta name="description" content="Answer wrong and you'll have to survive to stay in the game. Host on a shared screen, play from your phone." />
  <link rel="stylesheet" href="tokens.css" />
  <link rel="stylesheet" href="landing.css" />
</head>
<body>
  <a class="back-home-pill" href="https://prapachaiuea.github.io/party-games/" data-i18n="nav.home">Home</a>
  <main class="split" id="split">
    <a class="panel panel-host" href="host.html">
      <div class="panel-inner">
        <p class="eyebrow eyebrow-host" data-i18n="landing.eyebrowHost">On the shared screen</p>
        <h1 class="wordmark wordmark-host">TRIVIA MURDER PARTY</h1>
        <p class="tagline tagline-host" data-i18n="landing.taglineHost">Open the show on the TV, laptop, or iPad everyone can see.</p>
        <span class="cta cta-host" data-i18n="landing.ctaHost">Open the Show &rarr;</span>
      </div>
    </a>

    <a class="panel panel-player" href="player.html">
      <div class="panel-inner">
        <p class="eyebrow eyebrow-player" data-i18n="landing.eyebrowPlayer">On your phone</p>
        <h1 class="wordmark wordmark-player">trivia murder party</h1>
        <p class="tagline tagline-player" data-i18n="landing.taglinePlayer">Got a room code from the big screen? Take your seat and answer for your life.</p>
        <span class="cta cta-player" data-i18n="landing.ctaPlayer">Take Your Seat &rarr;</span>
      </div>
    </a>
  </main>

  <script type="module" src="js/landing.js"></script>
</body>
</html>
